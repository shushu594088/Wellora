[project]
name = "wellora-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pwdlib[argon2]>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.34,<1",
    "oss2>=2.19,<3",
    "python-multipart>=0.0.18,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
