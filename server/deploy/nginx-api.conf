# Dedicated Wellora API vhost; preserves shushu520.top apex site.
server {
    listen 80;
    server_name api.shushu520.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pixora-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://api.shushu520.top$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.shushu520.top;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/api.shushu520.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shushu520.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wellora_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 21m;
    client_body_timeout 120s;
    send_timeout 120s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8010;
    }
}
