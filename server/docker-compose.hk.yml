services:
  api:
    ports:
      - "127.0.0.1:8010:8000"
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head && exec uvicorn app:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips=172.29.240.1
    init: true
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    networks:
      edge: {}
      data: {}
  db:
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 128
networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.240.0/24
          gateway: 172.29.240.1
