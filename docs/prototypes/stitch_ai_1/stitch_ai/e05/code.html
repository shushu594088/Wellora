<div class="w-14 h-14 rounded-xl bg-secondary-container flex items-center justify-center text-primary flex-shrink-0">

</div>
<div class="flex flex-col gap-1">
<h2 class="font-headline-lg-elder text-headline-lg-elder text-on-surface">体检报告</h2>
<div class="flex items-center gap-2">

<span class="px-2.5 py-0.5 rounded-full bg-surface-container-high text-on-secondary-fixed-variant font-label-sm text-label-sm">示例内容</span>
</div>
</div>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary">

<!-- 核心语音解读播放卡片 -->
<section class="bg-secondary-container/60 rounded-xl p-5 shadow-sm flex flex-col items-center text-center relative overflow-hidden">
<div class="flex items-center justify-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[26px]">hearing</span>
<h3 class="font-title-elder text-title-elder text-primary">听报告解读</h3>
</div>
<p class="font-body-elder text-body-elder text-on-secondary-fixed-variant mb-5">AI 语音已为您总结好核心要点，点按下方即可听</p>
<!-- 播放与动效核心圆环 -->
<div class="relative my-1 flex items-center justify-center">
<div class="absolute w-28 h-28 rounded-full bg-primary-fixed/50 animate-ping opacity-25 hidden" id="audio-wave"></div>
<div class="relative w-24 h-24 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[48px]" id="player-icon">mic</span>
</div>
</div>
<!-- 播放进度条说明（默认待播放） -->
<div class="w-full mt-4 mb-2 flex items-center justify-between px-2 text-on-secondary-fixed-variant font-label-sm text-label-sm">
<span id="play-time-current">00:00</span>
<span class="text-secondary">AI 智能医生解读语音</span>
<span id="play-time-total">02:18</span>
</div>
<div class="w-full bg-surface-container-lowest/80 h-2.5 rounded-full overflow-hidden mb-5">
<div class="bg-primary h-full rounded-full transition-all duration-300 w-0" id="play-progress"></div>
</div>
<!-- 大播放按键 (长辈模式 ≥60px 高度) -->
<button class="w-full h-[60px] rounded-full bg-primary text-on-primary font-headline-lg-elder text-headline-lg-elder flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-transform" id="toggle-play-btn" type="button">
<span class="material-symbols-outlined text-[30px]" id="btn-icon">play_arrow</span>
<span id="btn-text">开始播放</span>
</button>
</section>
<!-- 重点指标速览模块 -->
<section class="bg-surface-container-lowest rounded-xl p-5 shadow-sm flex flex-col">
<div class="flex items-center justify-between pb-3 mb-1">
<div class="flex items-center gap-2">
<span class="w-1.5 h-6 rounded-full bg-primary"></span>
<h3 class="font-headline-lg-elder text-headline-lg-elder text-on-surface">先看这几项</h3>
</div>
<span class="font-body-elder text-body-elder text-secondary">共 3 项重点</span>
</div>
<div class="flex flex-col space-y-3">
<!-- 指标项 1: 血常规 -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-surface-container-lowest flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[26px]">water_drop</span>
</div>
<div>
<span class="font-title-elder text-title-elder text-on-surface block">血常规</span>
<span class="font-body-elder text-body-elder text-primary font-semibold">各项数值均在正常范围</span>
</div>
</div>
<button class="px-3.5 py-2 rounded-xl bg-surface-container-lowest text-primary font-headline-md text-headline-md flex items-center gap-1 active:bg-secondary-container transition-colors" type="button">
<span>查看结果</span>
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
<!-- 指标项 2: 肝功能 -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-surface-container-lowest flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[26px]">vital_signs</span>
</div>
<div>
<span class="font-title-elder text-title-elder text-on-surface block">肝功能</span>
<span class="font-body-elder text-body-elder text-secondary">谷丙转氨酶轻微偏高</span>
</div>
</div>
<button class="px-3.5 py-2 rounded-xl bg-surface-container-lowest text-primary font-headline-md text-headline-md flex items-center gap-1 active:bg-secondary-container transition-colors" type="button">
<span>查看结果</span>
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
<!-- 指标项 3: 血脂 -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-surface-container-lowest flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[26px]">science</span>
</div>
<div>
<span class="font-title-elder text-title-elder text-on-surface block">血脂</span>
<span class="font-body-elder text-body-elder text-primary font-semibold">甘油三酯指标正常</span>
</div>
</div>
<button class="px-3.5 py-2 rounded-xl bg-surface-container-lowest text-primary font-headline-md text-headline-md flex items-center gap-1 active:bg-secondary-container transition-colors" type="button">
<span>查看结果</span>
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
</div>
<!-- 底部参考提示 -->
<div class="mt-4 pt-3 flex items-start gap-2 text-secondary font-body-elder text-body-elder">
<span class="material-symbols-outlined text-[22px] flex-shrink-0 mt-0.5 text-secondary">info</span>
<span>解读供参考，就医时请带原报告</span>
</div>
</section>
<!-- 底部双快捷入口 -->
<section class="flex flex-col space-y-3 pt-2">
<!-- 入口一：和以前的报告比较 -->
<button class="w-full h-[60px] rounded-xl bg-primary text-on-primary font-headline-lg-elder text-headline-lg-elder flex items-center justify-center gap-2 shadow-sm active:opacity-90 transition-opacity" type="button">
<span class="material-symbols-outlined text-[26px]">leaderboard</span>
<span>和以前的报告比较</span>
</button>
<!-- 入口二：看看挂什么科 -->
<button class="w-full h-[58px] rounded-xl bg-surface-container-lowest text-primary font-headline-lg-elder text-headline-lg-elder flex items-center justify-center gap-2 shadow-sm active:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[26px]">stethoscope</span>
<span>看看挂什么科</span>
</button>
</section>
</div>
<script>
  (function () {
    const playBtn = document.getElementById('toggle-play-btn');
    const playIcon = document.getElementById('player-icon');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const audioWave = document.getElementById('audio-wave');
    const progressBar = document.getElementById('play-progress');
    const timeCurrent = document.getElementById('play-time-current');

    let isPlaying = false;
    let timer = null;
    let seconds = 0;
    const totalSeconds = 138;

    function formatTime(s) {
      const min = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${min}:${sec}`;
    }

    if (playBtn) {
      playBtn.addEventListener('click', function () {
        isPlaying = !isPlaying;
        if (isPlaying) {
          btnIcon.innerText = 'pause';
          btnText.innerText = '暂停播放';
          playIcon.innerText = 'volume_up';
          audioWave.classList.remove('hidden');

          timer = setInterval(function () {
            if (seconds < totalSeconds) {
              seconds++;
              timeCurrent.innerText = formatTime(seconds);
              const progressPct = (seconds / totalSeconds) * 100;
              progressBar.style.width = progressPct + '%';
            } else {
              clearInterval(timer);
              isPlaying = false;
              btnIcon.innerText = 'play_arrow';
              btnText.innerText = '重新播放';
              playIcon.innerText = 'mic';
              audioWave.classList.add('hidden');
              seconds = 0;
            }
          }, 1000);
        } else {
          btnIcon.innerText = 'play_arrow';
          btnText.innerText = '继续播放';
          playIcon.innerText = 'mic';
          audioWave.classList.add('hidden');
          if (timer) clearInterval(timer);
        }
      });
    }
  })();
</script></main></body></html>
