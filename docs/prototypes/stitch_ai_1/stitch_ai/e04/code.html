  </head><body class="bg-surface text-on-surface font-body-elder text-body-elder flex flex-col min-h-screen selection:bg-secondary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-20 px-space-md flex items-center justify-between gap-space-sm"><button aria-label="返回上一页" class="h-12 px-space-md min-w-[56px] flex items-center justify-center gap-space-xs rounded-xl text-primary bg-secondary-container hover:bg-secondary-fixed transition-colors active:scale-95" onclick="history.back()"><span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span><span class="font-headline-md text-headline-md">返回</span></button><h1 class="text-headline-lg-elder font-headline-lg-elder text-on-surface truncate flex-1 text-center">Report Verification</h1><div class="flex items-center justify-end min-w-[56px]"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-20 pb-safe bg-surface"><div class="flex flex-col w-full pb-8">
<div class="flex flex-col gap-4">
<!-- 提示条：浅灰蓝卡片 -->
<div class="w-full bg-surface-container-low rounded-xl px-4 py-3.5 flex items-center gap-3 shadow-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-[22px]" style="font-variation-settings: 'FILL' 1;">info</span>
</div>
<p class="font-headline-md text-headline-md text-on-surface font-semibold tracking-wide">
        还有 <span class="text-error font-bold">2</span> 项需要核对
      </p>
</div>
<!-- 示例报告缩略图卡片 -->
<div class="w-full bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-headline-md text-headline-md text-on-surface-variant flex items-center gap-1.5 font-medium">
<span class="material-symbols-outlined text-primary text-[20px]">description</span>
          原报告影像
        </span>
<span class="font-label-sm text-label-sm text-secondary bg-surface-container px-2.5 py-1 rounded-full">
          清晰度良好
        </span>
</div>
<div class="flex items-center gap-4 bg-surface-container-low/70 p-3 rounded-lg">
<!-- 缩略图预览 -->
<div class="relative w-24 h-20 rounded-md overflow-hidden bg-surface-container-lowest shadow-inner flex-shrink-0 flex items-center justify-center">
<img class="w-full h-full object-cover opacity-90" data-alt="A macro close-up photograph of a clean, typed clinical laboratory health checkup paper report document with tabular medical metrics, stamps, and high legible contrast under warm indoor medical office lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFGBx7LOkU9cSdyUEXi-otUel9R0AtxzgByNRvC2bIHDt3RpIseeRdEQiBUDeA4ubLHDVkGgGQDeAEmWQgwu_49c2M-xJVGsYXgleeHReGlZy0kGdbldzqy2jKZGzbnoyEI7FJ-05iYP6nqc6D-BuD8amgXDwHqj7U_l5MbG7R323a6Pi4I726XHv9YABFKHvm488p-Et7DhYUKf9100CE26KoSCXGVtjP7A6ToKcz"/>
<div class="absolute inset-0 bg-primary/5 pointer-events-none"></div>
</div>
<!-- 放大原图大操作按钮 -->
<div class="flex-1 flex flex-col justify-center">
<button aria-label="查看放大体检报告原件" class="w-full min-h-[50px] px-3 bg-secondary-container hover:bg-secondary-fixed active:scale-[0.98] transition-all rounded-lg flex items-center justify-center gap-2 text-primary font-headline-md text-headline-md font-semibold" id="zoomBtn" type="button">
<span class="material-symbols-outlined text-[24px]">zoom_in</span>
<span>放大原图</span>
</button>
<p class="font-label-sm text-label-sm text-outline text-center mt-1">方便老人看清纸质原字</p>
</div>
</div>
</div>
<!-- 单步聚焦核心交互区 -->
<div class="flex flex-col gap-2 mt-1">
<!-- 进度指示 -->
<div class="flex items-center justify-between px-1">
<span class="font-headline-md text-headline-md text-on-surface-variant font-bold">第 2 项，共 6 项</span>
<span class="font-body-md text-body-md text-primary font-semibold">校对进度 33%</span>
</div>
<!-- 进度条 -->
<div class="w-full h-3 bg-surface-container rounded-full overflow-hidden p-0.5 shadow-inner">
<div class="h-full bg-primary-container rounded-full transition-all duration-500 ease-out" style="width: 33.3%;"></div>
</div>
<!-- 聚焦大卡片 -->
<div class="w-full bg-surface-container-lowest rounded-xl p-5 shadow-md flex flex-col items-center text-center mt-2 relative overflow-hidden">
<div class="absolute top-0 inset-x-0 h-1.5 bg-primary"></div>
<!-- 字段名称 -->
<div class="flex items-center gap-2 text-on-surface-variant mb-3">
<span class="material-symbols-outlined text-primary text-[26px]">calendar_month</span>
<span class="font-title-elder text-title-elder font-bold text-on-surface">正在核对：检查日期</span>
</div>
<!-- 特大字段值展示高亮区 -->
<div class="w-full bg-surface-container-low py-5 px-3 rounded-xl mb-3 flex flex-col items-center justify-center shadow-inner">
<div class="font-headline-xl-elder text-headline-xl-elder font-extrabold text-primary tracking-tight" id="dateValue">
            2026年10月29日
          </div>
<div class="inline-flex items-center gap-1 mt-1 text-primary-container font-label-sm text-label-sm bg-primary-fixed/40 px-2 py-0.5 rounded-full">
<span class="material-symbols-outlined text-[14px]">auto_awesome</span>
            AI已从报告右上角自动识别
          </div>
</div>
<p class="font-body-elder text-body-elder text-secondary mb-5">
          请对照原报告确认日期是否一致
        </p>
<!-- 独立语音修改大按钮 -->
<button aria-label="按住或点击开始说话进行语音修改" class="w-full min-h-[58px] bg-surface-container-lowest hover:bg-secondary-container active:scale-[0.98] transition-all rounded-xl shadow-sm flex items-center justify-center gap-3 text-primary font-title-elder text-title-elder font-semibold" id="micEditBtn" type="button">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[26px]">mic</span>
</div>
<span id="micBtnText">说话修改</span>
</button>
</div>
</div>
<!-- 底部双大按钮操作区（长辈防误触规范） -->
<div class="flex flex-col gap-3 mt-3">
<!-- 主按钮 -->
<button class="w-full min-h-[64px] bg-primary hover:bg-primary-container active:scale-[0.98] text-on-primary rounded-xl font-title-elder text-title-elder font-bold shadow-md flex items-center justify-center gap-2 transition-all" id="confirmNextBtn" type="button">
<span class="material-symbols-outlined text-[28px]">check_circle</span>
<span>这项正确，下一项</span>
</button>
<!-- 次按钮 -->
<button class="w-full min-h-[56px] bg-surface-container-lowest hover:bg-surface-container text-primary rounded-xl font-headline-md text-headline-md font-semibold shadow-sm flex items-center justify-center gap-2 transition-all" id="saveLaterBtn" type="button">
<span class="material-symbols-outlined text-[24px]">save</span>
<span>先保存，稍后核对</span>
</button>
</div>
<!-- 听一遍说明辅助条 -->
<div class="flex items-center justify-center gap-2 py-1 text-on-surface-variant">
<button class="flex items-center gap-1.5 font-body-md text-body-md text-primary bg-secondary-container/60 hover:bg-secondary-container px-4 py-2 rounded-full active:scale-95 transition-all" id="readAloudBtn" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
<span>语音朗读本项内容</span>
</button>
</div>
</div>
<!-- 原图放大交互浮层 Modal -->
<div class="hidden fixed inset-0 z-50 bg-inverse-surface/80 backdrop-blur-md flex flex-col justify-end p-4" id="imageModal">
<div class="bg-surface-container-lowest rounded-2xl w-full max-h-[751px] p-5 flex flex-col gap-4 overflow-hidden shadow-2xl">
<div class="flex items-center justify-between">
<h3 class="font-title-elder text-title-elder font-bold text-on-surface">体检报告原件放大</h3>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface" id="closeModalBtn">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<div class="w-full h-80 rounded-xl overflow-hidden bg-surface-container flex items-center justify-center relative">
<img class="w-full h-full object-contain" data-alt="A full page high-resolution laboratory blood test analysis report sheet with clear hospital header, date stamps, and metric rows presented with crisp legible typography on high quality white textured paper." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDa8PBQbRBkI_cUVCrO_GgLsY_J6IOxT2NnBt9_RL3YJubdldfDOwHU1hU3urxBdjDaYi7gwI7a1B3zlmURiYzKx2gyb9udensyr2z7V7gULW_pRn_JWlA2aTivDRqyhGmo2SLobmtVYZ6Gwipl9zM3I9hV57zYNOmhuyHUjFRc8o0RWFZQtrM7OEcidwA0thJyvQHOHMLQKZoukWq-_i4l1ak-hn6ZnPZFb07LjeLj"/>
</div>
<p class="font-body-elder text-body-elder text-center text-secondary">
        提示：双指捏合可进一步缩放原件文字
      </p>
<button class="w-full min-h-[56px] bg-primary text-on-primary rounded-xl font-headline-md text-headline-md font-bold" id="closeModalConfirm">
        返回核对
      </button>
</div>
</div>
</div>
<script>
  (function() {
    const zoomBtn = document.getElementById('zoomBtn');
    const imageModal = document.getElementById('imageModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const closeModalConfirm = document.getElementById('closeModalConfirm');
    const micEditBtn = document.getElementById('micEditBtn');
    const micBtnText = document.getElementById('micBtnText');
    const dateValue = document.getElementById('dateValue');
    const confirmNextBtn = document.getElementById('confirmNextBtn');
    const readAloudBtn = document.getElementById('readAloudBtn');

    // 弹窗显隐
    if (zoomBtn && imageModal) {
      zoomBtn.addEventListener('click', () => {
        imageModal.classList.remove('hidden');
      });
    }

    const hideModal = () => {
      if (imageModal) imageModal.classList.add('hidden');
    };

    if (closeModalBtn) closeModalBtn.addEventListener('click', hideModal);
    if (closeModalConfirm) closeModalConfirm.addEventListener('click', hideModal);

    // 语音录音微交互
    let isListening = false;
    if (micEditBtn) {
      micEditBtn.addEventListener('click', () => {
        isListening = !isListening;
        if (isListening) {
          micBtnText.textContent = '正在倾听中...请说出新日期';
          micEditBtn.classList.add('bg-primary-fixed');
          setTimeout(() => {
            if (isListening) {
              dateValue.textContent = '2026年10月28日';
              micBtnText.textContent = '已修改！点击再次说话';
              micEditBtn.classList.remove('bg-primary-fixed');
              isListening = false;
            }
          }, 2400);
        } else {
          micBtnText.textContent = '说话修改';
          micEditBtn.classList.remove('bg-primary-fixed');
        }
      });
    }

    // 语音朗读模拟
    if (readAloudBtn) {
      readAloudBtn.addEventListener('click', () => {
        const originalText = readAloudBtn.innerHTML;
        readAloudBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-pulse">record_voice_over</span><span>正在为您大声朗读...</span>';
        setTimeout(() => {
          readAloudBtn.innerHTML = originalText;
        }, 2200);
      });
    }

    // 下一步按钮反馈
    if (confirmNextBtn) {
      confirmNextBtn.addEventListener('click', () => {
        confirmNextBtn.innerHTML = '<span class="material-symbols-outlined text-[28px] animate-spin">sync</span><span>已确认，加载下一项...</span>';
        setTimeout(() => {
          confirmNextBtn.innerHTML = '<span class="material-symbols-outlined text-[28px]">check_circle</span><span>这项正确，下一项</span>';
        }, 1200);
      });
    }
  })();
</script></main></body></html>
