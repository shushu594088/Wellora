<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-secondary-fixed-variant":"#3f4946","surface-container-high":"#dee9fc","on-primary-fixed":"#002018","secondary-fixed-dim":"#bec9c4","on-primary":"#ffffff","surface-tint":"#166a56","inverse-surface":"#27313f","inverse-on-surface":"#eaf1ff","secondary-fixed":"#dae5e0","on-tertiary-container":"#d4dadf","background":"#f8f9ff","tertiary-fixed-dim":"#c1c7cc","on-primary-container":"#9ce9cf","primary-fixed-dim":"#89d5bd","primary-fixed":"#a4f2d8","tertiary-fixed":"#dde3e8","primary-container":"#176b57","surface-dim":"#d0dbed","surface-container-highest":"#d9e3f6","on-surface-variant":"#3f4945","on-error":"#ffffff","surface-container-low":"#eff4ff","on-background":"#121c2a","inverse-primary":"#89d5bd","error":"#ba1a1a","outline-variant":"#bec9c3","on-secondary-container":"#5c6763","surface-container-lowest":"#ffffff","error-container":"#ffdad6","on-tertiary":"#ffffff","on-primary-fixed-variant":"#005140","on-secondary-fixed":"#141d1b","on-error-container":"#93000a","surface-variant":"#d9e3f6","on-tertiary-fixed-variant":"#41484c","secondary-container":"#dae5e0","on-secondary":"#ffffff","on-surface":"#121c2a","tertiary-container":"#596064","on-tertiary-fixed":"#161c20","secondary":"#56615d","primary":"#005141","surface-container":"#e6eeff","outline":"#6f7975","surface-bright":"#f8f9ff","surface":"#f8f9ff","tertiary":"#42484c"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter":"0.75rem","space-sm":"0.5rem","space-xl":"1.25rem","margin":"1rem","space-xs":"0.25rem","space-lg":"1rem","space-md":"0.75rem"},"fontFamily":{"body-lg":["Plus Jakarta Sans"],"title-elder":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"body-elder":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"headline-xl-elder":["Plus Jakarta Sans"],"headline-lg-elder":["Plus Jakarta Sans"]},"fontSize":{"body-lg":["16px",{"lineHeight":"22px","fontWeight":"500"}],"title-elder":["22px",{"lineHeight":"30px","fontWeight":"600"}],"headline-lg":["22px",{"lineHeight":"28px","fontWeight":"700"}],"body-elder":["17px",{"lineHeight":"26px","fontWeight":"400"}],"headline-md":["18px",{"lineHeight":"24px","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-sm":["12px",{"lineHeight":"16px","fontWeight":"500"}],"headline-xl-elder":["28px",{"lineHeight":"36px","fontWeight":"700"}],"headline-lg-elder":["24px",{"lineHeight":"32px","fontWeight":"700"}]}}}};</script><style>
    body {
      min-height: max(884px, 100dvh);

  </head><body class="bg-surface text-on-surface font-body-elder text-body-elder flex flex-col min-h-screen selection:bg-secondary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-20 px-space-md flex items-center justify-between gap-space-sm"><button aria-label="返回上一页" class="h-12 px-space-md min-w-[56px] flex items-center justify-center gap-space-xs rounded-xl text-primary bg-secondary-container hover:bg-secondary-fixed transition-colors active:scale-95" onclick="history.back()"><span class="material-symbols-outlined text-[28px]">arrow_back_ios_new</span><span class="font-headline-md text-headline-md">返回</span></button><h1 class="text-headline-lg-elder font-headline-lg-elder text-on-surface truncate flex-1 text-center">Report Comparison</h1><div class="flex items-center justify-end min-w-[56px]"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-20 pb-safe bg-surface"><div class="flex flex-col w-full pb-8 space-y-4">
<!-- 报告期次纵向选择区 (2个大条目卡片) -->
<section class="flex flex-col space-y-2.5">
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm px-4 h-14 flex items-center justify-between active:bg-secondary-container transition-colors cursor-pointer">
<div class="flex items-center gap-2.5 min-w-0">
<span class="material-symbols-outlined text-primary text-[26px]">description</span>
<span class="font-headline-md text-headline-md text-on-surface truncate">本次：10月28日</span>
</div>
<span class="material-symbols-outlined text-outline text-[24px]">chevron_right</span>
</div>
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm px-4 h-14 flex items-center justify-between active:bg-secondary-container transition-colors cursor-pointer">
<div class="flex items-center gap-2.5 min-w-0">
<span class="material-symbols-outlined text-secondary text-[26px]">description</span>
<span class="font-headline-md text-headline-md text-on-surface truncate">上次：7月20日</span>
</div>
<span class="material-symbols-outlined text-outline text-[24px]">chevron_right</span>
</div>
</section>
<!-- “一次看一个指标” 标题区域 -->
<section class="pt-2 flex items-center justify-between">
<h2 class="font-headline-lg-elder text-headline-lg-elder text-on-surface tracking-tight">一次看一个指标</h2>
<span class="font-body-md text-body-md text-on-surface-variant bg-surface-container px-3 py-1 rounded-full" id="step-indicator">第 1 / 3 项</span>
</section>
<!-- 单项聚焦指标对比大卡片 -->
<div class="w-full bg-surface-container-lowest rounded-2xl shadow-sm p-5 space-y-5 flex flex-col">
<!-- 当前项目大标题 -->
<div class="flex items-center gap-2.5">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[24px]" id="metric-icon">water_drop</span>
</div>
<span class="font-title-elder text-title-elder text-primary">当前项目：<span id="metric-title">血脂 (总胆固醇)</span></span>
</div>
<!-- 双列大字对比区域 -->
<div class="grid grid-cols-2 gap-3 bg-surface-container-low rounded-xl p-4 text-center">
<div class="flex flex-col items-center justify-center py-2 bg-surface-container-lowest rounded-lg shadow-sm">
<span class="font-body-lg text-body-lg text-on-surface-variant mb-1">上次</span>
<span class="font-headline-xl-elder text-headline-xl-elder text-on-surface tracking-wider font-bold" id="val-prev">5.82</span>
<span class="font-label-sm text-label-sm text-outline mt-0.5" id="unit-prev">mmol/L</span>
</div>
<div class="flex flex-col items-center justify-center py-2 bg-surface-container-lowest rounded-lg shadow-sm">
<span class="font-body-lg text-body-lg text-on-surface-variant mb-1">本次</span>
<span class="font-headline-xl-elder text-headline-xl-elder text-on-surface tracking-wider font-bold" id="val-curr">--</span>
<span class="font-label-sm text-label-sm text-outline mt-0.5" id="unit-curr">待复查</span>
</div>
</div>
<!-- 浅灰蓝合规提示条 -->
<div class="bg-surface-container-high text-on-surface rounded-xl p-4 flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-[28px] shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface font-semibold" id="notice-title">还不能直接比较</span>
<span class="font-body-elder text-body-elder text-on-surface-variant mt-0.5" id="notice-desc">请先核对两次检查的检验单位与检测方法。</span>
</div>
</div>
<!-- 突出语音入口：“听一遍说明” -->
<button class="w-full h-14 bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md rounded-xl flex items-center justify-center gap-2 active:scale-[0.99] transition-all" id="tts-btn">
<span class="material-symbols-outlined text-[26px]" id="tts-icon">volume_up</span>
<span id="tts-text">听一遍说明</span>
</button>
</div>
<!-- 上下翻页大控件 -->
<div class="grid grid-cols-2 gap-3 pt-1">
<button class="h-[58px] bg-surface-container-lowest hover:bg-surface-container text-on-surface font-headline-md text-headline-md rounded-xl shadow-sm flex items-center justify-center gap-1 active:scale-95 transition-all disabled:opacity-40 disabled:pointer-events-none" id="prev-btn">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
<span>上一项</span>
</button>
<button class="h-[58px] bg-primary hover:bg-primary-container text-on-primary font-headline-md text-headline-md rounded-xl shadow-sm flex items-center justify-center gap-1 active:scale-95 transition-all" id="next-btn">
<span>下一项</span>
<span class="material-symbols-outlined text-[24px]">chevron_right</span>
</button>
</div>
<!-- 底部操作：查看原始报告 -->
<div class="pt-2">
<button class="w-full h-14 bg-surface-container-lowest hover:bg-secondary-container text-primary font-headline-md text-headline-md rounded-xl shadow-sm flex items-center justify-center gap-2 active:scale-[0.99] transition-all">
<span class="material-symbols-outlined text-[24px]">article</span>
<span>查看原始报告</span>
</button>
</div>
</div>
<script>
  (function() {
    const metrics = [
      {
        icon: 'water_drop',
        title: '血脂 (总胆固醇)',
        prevVal: '5.82',
        prevUnit: 'mmol/L',
        currVal: '--',
        currUnit: '待复查',
        noticeTitle: '还不能直接比较',
        noticeDesc: '本次标本因检验方法差异，请先核对单位后再做趋势对比。',
        audioText: '血脂指标中，上次数值为5.82毫摩尔每升，本次结果暂未出具或方法不同，建议遵医嘱复查。'
      },
      {
        icon: 'favorite',
        title: '空腹血糖',
        prevVal: '6.40',
        prevUnit: 'mmol/L',
        currVal: '5.70',
        currUnit: 'mmol/L',
        noticeTitle: '指标较上次有所改善',
        noticeDesc: '数值从 6.40 下降至 5.70，已进入正常健康标准区间。',
        audioText: '空腹血糖较上次有了明显好转，当前数值为5.70，处于平稳范围，请继续保持健康饮食。'
      },
      {
        icon: 'vital_signs',
        title: '收缩压 (高压)',
        prevVal: '138',
        prevUnit: 'mmHg',
        currVal: '126',
        currUnit: 'mmHg',
        noticeTitle: '血压控制平稳',
        noticeDesc: '本次测量结果为 126 mmHg，属于理想控制范围。',
        audioText: '血压测量正常，本次高压126毫米汞柱，控制良好，请遵医嘱按时规律服药。'
      }
    ];

    let currentIndex = 0;
    let isPlayingAudio = false;

    const metricIcon = document.getElementById('metric-icon');
    const metricTitle = document.getElementById('metric-title');
    const valPrev = document.getElementById('val-prev');
    const unitPrev = document.getElementById('unit-prev');
    const valCurr = document.getElementById('val-curr');
    const unitCurr = document.getElementById('unit-curr');
    const noticeTitle = document.getElementById('notice-title');
    const noticeDesc = document.getElementById('notice-desc');
    const stepIndicator = document.getElementById('step-indicator');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const ttsBtn = document.getElementById('tts-btn');
    const ttsText = document.getElementById('tts-text');
    const ttsIcon = document.getElementById('tts-icon');

    function updateCard(idx) {
      const data = metrics[idx];
      metricIcon.textContent = data.icon;
      metricTitle.textContent = data.title;
      valPrev.textContent = data.prevVal;
      unitPrev.textContent = data.prevUnit;
      valCurr.textContent = data.currVal;
      unitCurr.textContent = data.currUnit;
      noticeTitle.textContent = data.noticeTitle;
      noticeDesc.textContent = data.noticeDesc;
      stepIndicator.textContent = `第 ${idx + 1} / ${metrics.length} 项`;

      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === metrics.length - 1;

      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
      isPlayingAudio = false;
      ttsText.textContent = '听一遍说明';
      ttsIcon.textContent = 'volume_up';
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard(currentIndex);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < metrics.length - 1) {
        currentIndex++;
        updateCard(currentIndex);
      }
    });

    ttsBtn.addEventListener('click', () => {
      if (!window.speechSynthesis) {
        alert('当前设备不支持语音播放');
        return;
      }

      if (isPlayingAudio) {
        window.speechSynthesis.cancel();
        isPlayingAudio = false;
        ttsText.textContent = '听一遍说明';
        ttsIcon.textContent = 'volume_up';
      } else {
        const textToRead = metrics[currentIndex].audioText;
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.9;
        utterance.onend = () => {
          isPlayingAudio = false;
          ttsText.textContent = '听一遍说明';
          ttsIcon.textContent = 'volume_up';
        };
        utterance.onerror = () => {
          isPlayingAudio = false;
          ttsText.textContent = '听一遍说明';
          ttsIcon.textContent = 'volume_up';
        };

        window.speechSynthesis.speak(utterance);
        isPlayingAudio = true;
        ttsText.textContent = '正在播放...点击停止';
        ttsIcon.textContent = 'stop_circle';
      }
    });

    updateCard(currentIndex);
  })();
</script></main></body></html>
