<h2 class="font-headline-lg-elder text-headline-lg-elder text-on-surface">选择适合自己的界面</h2>
<p class="font-body-elder text-body-elder text-on-surface-variant">轻触卡片选择您喜欢的显示风格与操作方式</p>
</div>
<div class="flex flex-col gap-4">
<!-- Option 1: Standard Mode (Unselected State) -->
<div class="group relative flex flex-col p-5 rounded-xl bg-surface-container-lowest shadow-sm transition-all duration-200 cursor-pointer active:scale-[0.99]" id="card-standard" onclick="selectMode('standard')">
<div class="flex items-start gap-3.5 mb-3">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 mt-0.5 transition-colors" id="radio-standard">

</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2">
<h3 class="font-headline-lg text-headline-lg text-on-surface">标准模式</h3>
</div>
<p class="font-body-elder text-body-elder text-on-surface-variant mt-0.5">报告、咨询、待办，清晰高效</p>
</div>
</div>
<!-- Preview Mockup: Standard density layout -->
<div class="bg-surface-container-low rounded-lg p-3 flex flex-col gap-2">
<div class="flex items-center gap-2 bg-surface-container-lowest p-2.5 rounded-lg shadow-sm">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-[20px]">description</span>
</div>
<div class="flex-1 flex flex-col gap-1.5">
<div class="h-2.5 bg-surface-container-highest rounded-full w-24"></div>
<div class="h-2 bg-surface-container rounded-full w-36"></div>
</div>
</div>
<div class="grid grid-cols-3 gap-2 pt-1">
<div class="h-10 bg-surface-container-lowest rounded-lg flex items-center justify-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[18px] text-primary">chat</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">问医</span>
</div>
<div class="h-10 bg-surface-container-lowest rounded-lg flex items-center justify-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[18px] text-primary">calendar_today</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">日程</span>
</div>
<div class="h-10 bg-surface-container-lowest rounded-lg flex items-center justify-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[18px] text-primary">check_circle</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">用药</span>
</div>
</div>
</div>
</div>
<!-- Option 2: Elder Mode (Currently Selected) -->
<div class="group relative flex flex-col p-5 rounded-xl bg-secondary-container shadow-md transition-all duration-200 cursor-pointer active:scale-[0.99]" id="card-elder" onclick="selectMode('elder')">
<div class="flex items-start gap-3.5 mb-3">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5 shadow-sm transition-colors" id="radio-elder">
<div class="w-3.5 h-3.5 rounded-full bg-on-primary"></div>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2.5 flex-wrap">
<h3 class="font-headline-lg text-headline-lg text-primary font-bold">长辈模式</h3>
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-primary-container text-on-primary font-label-sm text-label-sm font-semibold">
              当前使用
            </span>
</div>
<p class="font-headline-md text-headline-md text-primary mt-1 font-bold">大字、大按钮、说话就能用</p>
</div>
</div>
<!-- Preview Mockup: Voice-first elder layout -->
<div class="bg-surface-container-lowest/80 rounded-lg p-3.5 flex flex-col items-center gap-3">
<!-- Prominent Mic Disc -->
<div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center shadow-md animate-pulse">

</div>
<!-- Big intuitive touch pads -->
<div class="grid grid-cols-3 gap-2 w-full">

<span class="font-headline-md text-headline-md text-on-surface font-semibold text-[13px]">今天吃药</span>
</div>
<div class="h-14 bg-surface-container-lowest rounded-lg flex flex-col items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[24px] text-primary">stethoscope</span>

</div>

</div>
</div>
</div>
</div>
</div>
<!-- Reassurance Notice Banner -->
<div class="mt-5 flex items-center gap-3 px-4 py-3.5 rounded-xl bg-surface-container-low text-on-surface">
<div class="w-7 h-7 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px] text-primary">info</span>
</div>
<span class="font-body-elder text-body-elder text-on-surface-variant font-medium">
      切换模式，所有健康与用药资料完全保留
    </span>
</div>
<!-- Primary Action & Footnote -->
<div class="mt-8 flex flex-col gap-3">
<button class="w-full h-16 rounded-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-headline-lg-elder text-headline-lg-elder flex items-center justify-center shadow-md active:scale-[0.98] transition-all" id="confirm-button" onclick="applyMode()">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-[26px]">check_circle</span>
        使用此模式
      </span>
</button>
<p class="font-body-md text-body-md text-outline text-center">
      随时可在「我的 - 显示设置」中自由切换
    </p>
</div>
</div>
<script>
  let selected = 'elder';

  function selectMode(mode) {
    selected = mode;
    const cardStd = document.getElementById('card-standard');
    const radioStd = document.getElementById('radio-standard');
    const cardEld = document.getElementById('card-elder');
    const radioEld = document.getElementById('radio-elder');

    if (mode === 'elder') {
      cardEld.className = "group relative flex flex-col p-5 rounded-xl bg-secondary-container shadow-md transition-all duration-200 cursor-pointer active:scale-[0.99]";
      radioEld.className = "w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5 shadow-sm transition-colors";
      radioEld.innerHTML = '<div class="w-3.5 h-3.5 rounded-full bg-on-primary"></div>';

      cardStd.className = "group relative flex flex-col p-5 rounded-xl bg-surface-container-lowest shadow-sm transition-all duration-200 cursor-pointer active:scale-[0.99]";
      radioStd.className = "w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 mt-0.5 transition-colors";
      radioStd.innerHTML = '<div class="w-4 h-4 rounded-full bg-surface-container-lowest"></div>';
    } else {
      cardStd.className = "group relative flex flex-col p-5 rounded-xl bg-secondary-container shadow-md transition-all duration-200 cursor-pointer active:scale-[0.99]";
      radioStd.className = "w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5 shadow-sm transition-colors";
      radioStd.innerHTML = '<div class="w-3.5 h-3.5 rounded-full bg-on-primary"></div>';

      cardEld.className = "group relative flex flex-col p-5 rounded-xl bg-surface-container-lowest shadow-sm transition-all duration-200 cursor-pointer active:scale-[0.99]";
      radioEld.className = "w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 mt-0.5 transition-colors";
      radioEld.innerHTML = '<div class="w-4 h-4 rounded-full bg-surface-container-lowest"></div>';
    }
  }

  function applyMode() {
    const btn = document.getElementById('confirm-button');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="flex items-center gap-2"><span class="material-symbols-outlined text-[26px] animate-spin">sync</span> 正在切换...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="flex items-center gap-2"><span class="material-symbols-outlined text-[26px]">task_alt</span> 切换成功</span>';
      setTimeout(() => {
        btn.innerHTML = originalText;
      }, 1200);
    }, 600);
  }
</script></main></body></html>
