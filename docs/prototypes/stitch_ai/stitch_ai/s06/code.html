</div>
</button>

</div>
<!-- Previous Report (上次) -->

</div>
</button>
</div>
</div>

<div class="w-full flex items-center justify-around bg-surface-container-lowest rounded-xl p-1 shadow-sm">

<button class="flex-1 relative py-2.5 flex flex-col items-center justify-center text-primary font-headline-md text-headline-md font-semibold transition-all" id="tab-overview" type="button">
<span>变化概览</span>
<span class="absolute bottom-1 w-10 h-0.5 bg-primary rounded-full"></span>
</button>
<!-- Secondary Tab: 逐项查看 -->

<div class="flex items-center gap-space-xs">

<span class="font-body-md text-body-md text-tertiary font-medium">先确认单位与检测方法</span>
</div>
<span class="material-symbols-outlined text-outline text-[18px]">arrow_forward_ios</span>

<div class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">

</div>
<div class="flex items-center gap-6 font-body-md text-body-md text-secondary pr-2">

<div class="flex items-center gap-6 font-body-md text-body-md text-secondary pr-2">

</div>
</div>

<div class="flex items-center justify-between p-space-sm rounded-lg bg-surface hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary-container text-[20px]">bar_chart</span>
<span class="font-body-md text-body-md text-on-surface">参考范围</span>
</div>
<div class="flex items-center gap-6 font-body-md text-body-md text-secondary pr-2">
<span class="w-8 text-center tracking-widest text-outline">--</span>
<span class="w-8 text-center tracking-widest text-outline">--</span>
</div>
</div>
</div>

<div class="w-full bg-surface-container-low rounded-xl p-space-md flex items-start gap-space-xs">

<div class="flex flex-col">

</div>
</div>

<span class="font-body-md text-body-md text-on-surface-variant font-medium">确认可比数据后查看变化趋势</span>

</div>
</div>
<!-- Action Row: 选择其他报告 -->
<button class="w-full flex items-center justify-between p-space-sm rounded-lg hover:bg-surface-container-low transition-colors group" type="button">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary-container text-[22px]">bar_chart</span>
<span class="font-body-md text-body-md text-on-surface font-medium">选择其他报告</span>
</div>

</button>
</div>

<button class="w-full h-12 bg-primary-container text-on-primary rounded-xl font-headline-md text-headline-md font-semibold flex items-center justify-center gap-space-xs shadow-sm active:opacity-90 active:scale-[0.99] transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">description</span>
<span>查看原始报告</span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    const tabOverview = document.getElementById('tab-overview');
    const tabDetailed = document.getElementById('tab-detailed');

    if (tabOverview && tabDetailed) {
      tabDetailed.addEventListener('click', function() {
        tabDetailed.classList.remove('text-secondary', 'font-medium');
        tabDetailed.classList.add('text-primary', 'font-semibold');
        
        tabOverview.classList.remove('text-primary', 'font-semibold');
        tabOverview.classList.add('text-secondary', 'font-medium');

        let indicator = tabOverview.querySelector('span:last-child');
        if (indicator) {
          tabOverview.removeChild(indicator);
          const newIndicator = document.createElement('span');
          newIndicator.className = 'absolute bottom-1 w-10 h-0.5 bg-primary rounded-full';
          tabDetailed.appendChild(newIndicator);
        }
      });

      tabOverview.addEventListener('click', function() {
        tabOverview.classList.remove('text-secondary', 'font-medium');
        tabOverview.classList.add('text-primary', 'font-semibold');

        tabDetailed.classList.remove('text-primary', 'font-semibold');
        tabDetailed.classList.add('text-secondary', 'font-medium');

        let indicator = tabDetailed.querySelector('span:last-child');
        if (indicator) {
          tabDetailed.removeChild(indicator);
          const newIndicator = document.createElement('span');
          newIndicator.className = 'absolute bottom-1 w-10 h-0.5 bg-primary rounded-full';
          tabOverview.appendChild(newIndicator);
        }
      });
    }
  })();
